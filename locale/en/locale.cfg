[mod-name]
big-beautiful-module-icons=Big Beautiful Module Icons

[mod-description]
big-beautiful-module-icons=Tired of needing a microscope to view modules in ALT-mode? Annoyed that the modules clip into other alt mode icons? Installed a """balanced""" mod that adds 100s of module slots? Big Beautiful Module Icons automatically rescales and repositions module icon alt-mode draw specifications with sensible defaults.

[mod-setting-name]
bbmi-max-rendered-module-icons=Maximum rendered module icons
bbmi-rendered-recipe-icon-scale=Rendered recipe icon scale

[mod-setting-description]
bbmi-max-rendered-module-icons=Maximum number of module icons to render in ALT-mode when a machine has many module slots. A value of 0 means no cap / feature off (the setting is disabled and all module icons are rendered as before). Values from 1 to 20 limit how many module icons are drawn per machine.
bbmi-rendered-recipe-icon-scale=Scale of the active-recipe icon drawn in ALT-mode above a machine's module icons. The icon is anchored to the top edge of the machine's bounding box and grows inward/downward. Default 1.8 (the previous hardcoded value).